# versión 0.8.4
probe_registers:
  fields:
    expected:
      name: "SOC esperado"
      description: "SOC % actual que muestra la pantalla o APP Solarman"
      example: 73
      required: true
      selector:
        number:
          min: 0
          max: 100
    register:
      name: "Dirección del registro"
      description: "Dirección a leer (por defecto: probe.addr de cada familia)"
      example: 184
      required: false
      selector:
        number:
          min: 1
          max: 9999
    familia:
      name: "Familia"
      description: "Sondear solo esta familia (por defecto: todas)"
      required: false
      selector:
        select:
          options:
            - "estandar"
    reset:
      name: "Reset"
      description: "Borra la validación persistida de la familia y vuelve a 'unavailable', sin sondear."
      required: false
      default: false
      selector:
        boolean: {}
