# versión 0.9.0
probe_registers:
  fields:
    expected:
      name: "SOC esperado"
      description: "SOC % actual que muestra la pantalla o APP Solarman"
      example: 73
      required: true
      selector:
        number:
          min: 0
          max: 100
    register:
      name: "Dirección del registro"
      description: "Dirección a leer (por defecto: probe.addr de cada familia)"
      example: 184
      required: false
      selector:
        number:
          min: 1
          max: 9999
    familia:
      name: "Familia"
      description: "Sondear solo esta familia (por defecto: todas)"
      required: false
      selector:
        select:
          options:
            - "estandar"
    reset:
      name: "Reset"
      description: "Borra la validación persistida de la familia y vuelve a 'unavailable', sin sondear."
      required: false
      default: false
      selector:
        boolean: {}
regenerate_plan:
  name: "Regenerar plan"
  description: >-
    Recalcula inmediatamente el plan de la batería (predicción + precios
    + SOC real). Dry-run: no escribe en el inversor.
force_mode:
  name: "Forzar modo"
  description: >-
    Fuerza una acción manual (AUTOCONSUMO, CARGA_RED, VENTA_RED o
    MANTENER) hasta la fecha 'until'. Respeta todas las salvaguardas
    y expira solo al llegar 'until'.
  fields:
    mode:
      name: "Acción"
      description: "Acción forzada hasta 'until'"
      required: true
      selector:
        select:
          options:
            - "AUTOCONSUMO"
            - "CARGA_RED"
            - "VENTA_RED"
            - "MANTENER"
    until:
      name: "Hasta"
      description: "Fecha y hora de expiración (ISO 8601, debe ser futura)"
      required: true
      selector:
        datetime: {}
release_manual:
  name: "Liberar modo manual"
  description: >-
    Libera inmediatamente el modo manual y vuelve al plan.
