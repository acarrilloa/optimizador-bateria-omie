# Mapa de registros del inversor Deye SUN-6K-SG05LP1-EU-AM2-P (vía datalogger Solarman).
# Las direcciones viven SOLO en este fichero: prohibido hardcodearlas en código.
# Override de usuario (sobrevive a actualizaciones de HACS):
#   config/optimizador_bateria_omie/registers.yaml
# versión: 0.8.5
inverter: "deye-sun-6k-sg05lp1-am2"
block_size: 16

familias:
  estandar:
    probe:  { funcion: soc, addr: 184 }
    plausibility:
      soc:          [0, 100]
      potencia_bat: [-7000, 7000]
    telemetria:
      soc:            { addr: 184, scale: 1,    unit: "%" }
      potencia_bat:   { addr: 190, scale: 1,    unit: "W", signed: true, invertir_signo: false, signo_semantico: "+descarga/-carga" }
      corriente_bat:  { addr: 191, scale: 0.01, unit: "A", signed: true }
      # Añadimos voltaje y temperatura (Offset de +1000) por completitud, aunque no se usen en los sensores actuales
      voltaje_bat:    { addr: 183, scale: 0.01, unit: "V" }
      temperatura_inversor: { addr: 90,  scale: 0.1, unit: "°C", offset: 1000 }
      temperatura_bateria: { addr: 182, scale: 0.1, unit: "°C", offset: 1000 }
    # NOTA: En estos manuales no se ven los registros de consumo de casa y FV en el mismo bloque, 
    # suelen estar en los registros 166 (Gen), 167/168 (Grid), 175 (Inverter output), etc.
    # Dejamos el consumo y FV apuntando a sus direcciones estándar para probar.
      consumo_casa:   { addr: 178, scale: 1,    unit: "W", signed: true } # Load side Total power
      produccion_fv:  { addr: 186, scale: 1,    unit: "W" }               # PV1 input power (si hay más strings, se suman)
    # ── Control (F4): usado por el Executor vía servicios de la integración Solarman ──
    # 210 limita la carga de batería desde CUALQUIER fuente (PV + red): el Executor lo fija
    # a la corriente equivalente a potencia_max_carga (valor constante entre tramos).
    # 230/232 gobiernan SOLO la carga desde red. 217/218: soc_recuperacion > soc_minimo.
    # Registros Deye de solo lectura relacionados (documentación, no escritura):
    #   169  potencia total de red (W, signed; >0 = importación/compra)
    #   424-425  medidor externo (convención OPUESTA: compra negativa) → normalizar a importación positiva
    #   103-106  Fault information words 1-4 (F07-F64); 101-102 advertencias; 117-118 alarms
    control:
      corriente_carga:      { addr: 210, scale: 1, unit: "A", min: 0, max: 135 }
      corriente_descarga:   { addr: 211, scale: 1, unit: "A", min: 0, max: 135 }
      corriente_carga_red:  { addr: 230, scale: 1, unit: "A", min: 0, max: 135 }
      habilitar_carga_red:  { addr: 232, valores: [0, 1] }
      soc_minimo:           { addr: 217, scale: 1, unit: "%", min: 10, max: 100 }
      soc_recuperacion:     { addr: 218, scale: 1, unit: "%", min: 10, max: 100 }
