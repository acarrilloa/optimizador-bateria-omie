# Mapa de registros del inversor Deye SUN-6K-SG05LP1-EU-AM2-P (vía datalogger Solarman).
# Las direcciones viven SOLO en este fichero: prohibido hardcodearlas en código.
# Override de usuario (sobrevive a actualizaciones de HACS):
#   config/optimizador_bateria_omie/registers.yaml
# versión: 0.10.0
inverter: "deye-sun-6k-sg05lp1-am2"
block_size: 16

familias:
  estandar:
    probe:  { funcion: soc, addr: 184 }
    plausibility:
      soc:          [0, 100]
      potencia_bat: [-7000, 7000]
    telemetria:
      soc:            { addr: 184, scale: 1,    unit: "%" }
      potencia_bat:   { addr: 190, scale: 1,    unit: "W", signed: true, invertir_signo: false, signo_semantico: "+descarga/-carga" }
      corriente_bat:  { addr: 191, scale: 0.01, unit: "A", signed: true }
      # Añadimos voltaje y temperatura (Offset de +1000) por completitud, aunque no se usen en los sensores actuales
      voltaje_bat:    { addr: 183, scale: 0.01, unit: "V" }
      temperatura_inversor: { addr: 90,  scale: 0.1, unit: "°C", offset: 1000 }
      temperatura_bateria: { addr: 182, scale: 0.1, unit: "°C", offset: 1000 }
    # NOTA: En estos manuales no se ven los registros de consumo de casa y FV en el mismo bloque, 
    # suelen estar en los registros 166 (Gen), 167/168 (Grid), 175 (Inverter output), etc.
    # Dejamos el consumo y FV apuntando a sus direcciones estándar para probar.
      consumo_casa:   { addr: 178, scale: 1,    unit: "W", signed: true } # Load side Total power
      produccion_fv:  { addr: 186, scale: 1,    unit: "W" }               # PV1 input power (si hay más strings, se suman)
    # ── Control (F4): usado por el Executor vía servicios de la integración Solarman ──
    # 210 limita la carga de batería desde CUALQUIER fuente (PV + red): el Executor lo fija
    # a la corriente equivalente a potencia_max_carga (valor constante entre tramos).
    # 230/232 gobiernan SOLO la carga desde red. 217/218: soc_recuperacion > soc_minimo.
    # Registros Deye de solo lectura relacionados (documentación, no escritura):
    #   169  potencia total de red (W, signed; >0 = importación/compra)
    #   424-425  medidor externo (convención OPUESTA: compra negativa) → normalizar a importación positiva
    #   103-106  Fault information words 1-4 (F07-F64); 101-102 advertencias; 117-118 alarms
    control:
      corriente_carga:      { addr: 210, scale: 1, unit: "A", min: 0, max: 135 }
      corriente_descarga:   { addr: 211, scale: 1, unit: "A", min: 0, max: 135 }
      corriente_carga_red:  { addr: 230, scale: 1, unit: "A", min: 0, max: 135 }
      habilitar_carga_red:  { addr: 232, valores: [0, 1] }
      # F5.2 (21-nov-2026): el Deye evalúa la carga desde red como AND
      # (V batería < 228 Y SOC < 229). Con el 228 de fábrica (4900 =
      # 49 V) una batería a ~52 V congela la carga y suspende además
      # la descarga. Se dejan en 6100/100 (llave real: 232) y el
      # Executor los sanea antes de cada CARGA_RED (derivas por push
      # de configuración del datalogger Solarman tras reinicios de HA).
      arranque_carga_red_v:   { addr: 228, scale: 1, unit: "0.01V", min: 0, max: 6300 }
      arranque_carga_red_soc: { addr: 229, scale: 1, unit: "%", min: 0, max: 100 }
      # F5.2: límite de exportación a red (para capar la corriente de VENTA_RED)
      max_exportacion_red:    { addr: 245, scale: 1, unit: "W", min: 0, max: 8000 }
      soc_minimo:           { addr: 217, scale: 1, unit: "%", min: 10, max: 100 }
      soc_recuperacion:     { addr: 218, scale: 1, unit: "%", min: 10, max: 100 }
      # ── F6/A (24-nov-2026): tabla ToU como actuador (Programa 1) ──
      # Con 248=1 (auto-restaurado por firmware: NO escribir jamás) el inversor
      # SOLO mueve energía por la batería según los segmentos de esta tabla; los
      # amperajes solos producen el "float" crónico. 249 (day-bits) TAMBIÉN queda
      # prohibido: day-bits escritos = venta autónoma. Solo se escribe 250-279.
      # Formato verificado en producción (lectura 24-nov con carga a 4-5 kW):
      #   250-255 puntos horarios 1-6, HHMM decimal (0 = inactivo)
      #   256-261 potencia por punto (W), 262-267 volt-stop (0.01 V, 4900 visto)
      #   268-273 SOC-stop por punto (%), 274-279 flags (5=carga, 4=venta, 0=inactivo)
      # Los atributos del punto i describen el segmento [i, i+1); punto 2 del
      # segmento es solo el marcador de fin (sus campos van a 0).
      tou_hora_1:      { addr: 250, scale: 1, unit: "HHMM", min: 0, max: 2359 }
      tou_hora_2:      { addr: 251, scale: 1, unit: "HHMM", min: 0, max: 2359 }
      tou_hora_3:      { addr: 252, scale: 1, unit: "HHMM", min: 0, max: 2359 }
      tou_hora_4:      { addr: 253, scale: 1, unit: "HHMM", min: 0, max: 2359 }
      tou_hora_5:      { addr: 254, scale: 1, unit: "HHMM", min: 0, max: 2359 }
      tou_hora_6:      { addr: 255, scale: 1, unit: "HHMM", min: 0, max: 2359 }
      tou_potencia_1:  { addr: 256, scale: 1, unit: "W", min: 0, max: 8000 }
      tou_potencia_2:  { addr: 257, scale: 1, unit: "W", min: 0, max: 8000 }
      tou_potencia_3:  { addr: 258, scale: 1, unit: "W", min: 0, max: 8000 }
      tou_potencia_4:  { addr: 259, scale: 1, unit: "W", min: 0, max: 8000 }
      tou_potencia_5:  { addr: 260, scale: 1, unit: "W", min: 0, max: 8000 }
      tou_potencia_6:  { addr: 261, scale: 1, unit: "W", min: 0, max: 8000 }
      tou_vstop_1:     { addr: 262, scale: 1, unit: "0.01V", min: 0, max: 6300 }
      tou_vstop_2:     { addr: 263, scale: 1, unit: "0.01V", min: 0, max: 6300 }
      tou_vstop_3:     { addr: 264, scale: 1, unit: "0.01V", min: 0, max: 6300 }
      tou_vstop_4:     { addr: 265, scale: 1, unit: "0.01V", min: 0, max: 6300 }
      tou_vstop_5:     { addr: 266, scale: 1, unit: "0.01V", min: 0, max: 6300 }
      tou_vstop_6:     { addr: 267, scale: 1, unit: "0.01V", min: 0, max: 6300 }
      tou_soc_stop_1:  { addr: 268, scale: 1, unit: "%", min: 0, max: 100 }
      tou_soc_stop_2:  { addr: 269, scale: 1, unit: "%", min: 0, max: 100 }
      tou_soc_stop_3:  { addr: 270, scale: 1, unit: "%", min: 0, max: 100 }
      tou_soc_stop_4:  { addr: 271, scale: 1, unit: "%", min: 0, max: 100 }
      tou_soc_stop_5:  { addr: 272, scale: 1, unit: "%", min: 0, max: 100 }
      tou_soc_stop_6:  { addr: 273, scale: 1, unit: "%", min: 0, max: 100 }
      tou_flag_1:      { addr: 274, scale: 1, unit: "flag", min: 0, max: 5 }
      tou_flag_2:      { addr: 275, scale: 1, unit: "flag", min: 0, max: 5 }
      tou_flag_3:      { addr: 276, scale: 1, unit: "flag", min: 0, max: 5 }
      tou_flag_4:      { addr: 277, scale: 1, unit: "flag", min: 0, max: 5 }
      tou_flag_5:      { addr: 278, scale: 1, unit: "flag", min: 0, max: 5 }
      tou_flag_6:      { addr: 279, scale: 1, unit: "flag", min: 0, max: 5 }
